      Statement of Erdős Problem #510 as Erdos510.erdos_510, tagged research open. The main
      compared theorem of this repository is its negation, with the namespace, open
      declarations and statement text copied verbatim from this file; following that
      repository's convention for disproved problems, the theorem keeps the name
      erdos_510. This repository does not depend on formal-conjectures.
  - id: "https://github.com/KnowledgeSense/math/tree/91f1bdd2a10abeb28acc742ce3ee884874caf124/preprints/Chowlas-Cosine-Problem-with-Near-Unit-Coefficients-October-12-2026/lean"
    relationship: "independent"
    note: >-
      Lean formalization of a lower bound for cosine sums with coefficients in [0.99, 1.01]
      (minimum at most -N^(1/9)/20). It concerns the other side of the problem and is
      consistent with the counterexample.
  - id: "https://github.com/rjwalters/lean-genius/blob/15110ef2440acd23105e78d2dc522311736f1b75/proofs/Proofs/Erdos510WIP01.lean"
