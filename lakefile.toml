name = "chowlaopus"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ChowlaOpus", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "ChowlaOpus"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
