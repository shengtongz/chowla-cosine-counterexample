    relationship: "formalizes"
    note: >-
      The formalization follows the architecture of this manuscript. The manuscript,
      including the counterexample and its proof, was produced by the AI model Astra 6.2,
      prompted by Shengtong Zhang; the PDF itself carries no author list. It has no public
      identifier, so it cannot be independently confirmed at the time of submission. Places where the Lean proof argues differently from the
