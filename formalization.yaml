status:
  scope: >-
    Complete formalization of Theorem 1 of the manuscript and of the resulting negation of
    Chowla's cosine conjecture, in the form of the negation of the formal-conjectures
    statement Erdos510.erdos_510. The quantitative form (1) of the manuscript, with
    A contained in [1, ceil(P T^2)], c1 P/T <= |A| <= c2 P/T and depth
    D(A) = -min_t f_A(t) <= C (log T) T^(-1/2) sqrt(|A|) for absolute constants c1, c2, C,
    is not exported as a separate theorem; the proof uses
    estimates of this shape internally, with unspecified constants.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Erdos510.erdos_510"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator.json"
    - declaration: "cosine_counterexample"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5.5"
      framework: "Cursor (agent mode with parallel subagents)"
      tool_setup: >-
        One orchestrating agent read the manuscript, wrote the shared definitions
        (ChowlaOpus/Basic.lean, ChowlaOpus/Profile/Defs.lean) and split the proof into
        component statements (ChowlaOpus/Statements.lean). It then launched 24 parallel
        subagents running the same model; each proved one or two component files in
        ChowlaOpus/Parts/ with shell access to Lean 4.36.0, Lake and Mathlib v4.36.0. The
        orchestrator recompiled every component, checked for sorry and ran #print axioms,
        assembled ChowlaOpus/Main.lean, and later ported all files to the Lean module system
        and wrote the Challenge/Solution pair and this metadata.
      cost:
        wall_time: "about 2.5 hours from the start of the session to a complete build, plus about 1 hour of packaging"
        hardware: "API-hosted model; Lean builds on one local macOS machine"
      prompting_notes: >-
        The human asked for a complete Lean formalization of Theorem 1 of the manuscript and
        for heavy use of parallel agents. Each subagent received the shared definitions, its
        target statement, the relevant part of the manuscript, and the restriction to the
        three standard axioms. All Lean code was written by the agents; the human wrote none.
  notes: >-
    Shengtong Zhang directed the work and made the packaging decisions and is responsible
    for the formalization. The mathematics comes from the manuscript cited in sources, which
    was produced by the AI model Astra 6.2, prompted by Shengtong Zhang. The Lean code was
    produced by the Claude Opus 5.5 agents described above.

fidelity:
  divergences: >-
    (1) Of the manuscript's results, only the qualitative Theorem 1 is a compared theorem;
    see status.scope.
    (2) Chowla's conjecture enters through the formal-conjectures statement
    Erdos510.erdos_510, which differs from the manuscript's formulation in presentation
    only: it uses cos(n theta) with theta = 2 pi t, A : Finset N with 0 not in A instead of
    a set of positive integers, "there exists theta with sum < -c sqrt(N)" in place of
    "min_t f_A(t) < -c sqrt(|A|)" (equivalent because f_A is continuous and periodic, so
    the minimum is attained), and asks for the bound only for all sufficiently large N.
    The last point makes its negation stronger than the negation of the conjecture for
    all A.
    (3) Lemma 2: the Mellin identity is proved by three explicit Fubini interchanges with
    Gamma-function integrals and Legendre duplication, instead of citing DLMF 10.22.43 and
    continuing analytically; the bound Gs = O(e^{-2s}) comes from |J_0(r) - 1| <= r^2/4.
    (4) Lemma 3 uses the manuscript's parameters h = T^-2 and X = T^2 and Fejér degree
    J = ceil(T^8).
    (5) The kernel character is defined as u -> psi(1 - u^(p-1)) with psi the standard additive
    character of Z/p^2Z; this equals the manuscript's character chi_0 built from the Fermat
    quotient.
    (6) Phase approximation: instead of Haar equidistribution and approximation by
    trigonometric polynomials, the proof averages an explicit nonnegative trigonometric
    kernel over characters of the form xi^2 (automatically even), using orthogonality of
    Dirichlet characters and a Cauchy-Schwarz bound for the constant term.
    (7) Lemma 4: Spencer's theorem is proved (partial colouring via a Hoeffding bound and a
    Jensen-type pigeonhole argument, then iteration) rather than cited, and the extension
    from a mesh to the whole circle uses a discrete de la Vallée-Poussin interpolation
    identity (constant 2 for meshes of at least 4N points) instead of Bernstein's inequality.
    (8) Lean's Bochner integral of a non-integrable function is 0, so the label mean
    ell(x) = (1/2) log(1 + x^-2) evaluates to 0 at x = 0; the proofs handle this point with
    almost-everywhere arguments.

review:
  status: "agent-reviewed"
  notes: >-
    No human has reviewed the formal statements or proofs before submission. The
    orchestrating agent (the same model as the subagents, so not an independent reviewer)
    recompiled every component, confirmed that no sorry remains, checked #print axioms, and
    compared the Challenge statements with Theorem 1 of the manuscript and with Chowla's
    formulation of the conjecture, and checked by a textual diff that the statement of
    Erdos510.erdos_510 equals the formal-conjectures statement at commit 7db2ea3 apart from
    the added negation. Correctness of the proof rests on the Lean kernel.

alignment:
  namespace: "ChowlaOpus"
  statements:
    - source: "Theorem 1"
      lean: "cosine_counterexample (Challenge.lean, Solution.lean); ChowlaOpus.main_theorem"
      module: "Challenge, Solution, ChowlaOpus.Main"
      status: "proved"
    - source: "Chowla's conjecture (Chowla 1965, eq. (14); Erdős Problem #510) is false"
      lean: "Erdos510.erdos_510 (negation of the formal-conjectures statement)"
      module: "Challenge, Solution"
      status: "proved"
    - source: "Lemma 2 (Bessel transform, multiplier m(tau))"
      lean: "ChowlaOpus.j0Statement_holds, besselPlaneStatement_holds, multStatement_holds, mellinStatement_holds"
      module: "ChowlaOpus.Parts.J0, ChowlaOpus.Parts.Mellin"
      status: "proved"
    - source: "Section 1 facts on the annulus slices B_s and ell(x)"
      lean: "ChowlaOpus.annulusStatement_holds"
      module: "ChowlaOpus.Parts.Annulus"
      status: "proved"
    - source: "Lemma 3 (finite profiles W and Q)"
      lean: "ChowlaOpus.lemma3Statement_holds"
      module: "ChowlaOpus.Parts.AsmA (with Bump, Fejer, Coeff, W, Q, Var)"
      status: "proved"
    - source: "Section 3 (separating label frequencies)"
      lean: "ChowlaOpus.profileStatement_holds"
      module: "ChowlaOpus.Parts.Aux3 (with Saw)"
      status: "proved"
    - source: "Section 4 (Chinese remainder construction, kernel character, identity (7), phases (8))"
      lean: "ChowlaOpus.crtStatement_holds, kernelCharStatement_holds, rowSumStatement_holds, phaseStatement_holds"
      module: "ChowlaOpus.Parts.CRT, KChar, Gauss, Phase"
      status: "proved"
    - source: "Section 5 (Poisson summation, bounds (9) and (10))"
      lean: "ChowlaOpus.poissonStatement_holds, w9Statement_holds, w10Statement_holds, weightsStatement_holds"
      module: "ChowlaOpus.Parts.Poisson, W9, W10, AsmB"
      status: "proved"
    - source: "Lemma 4 (rounding) and the final combination"
      lean: "ChowlaOpus.partialColoringStatement_holds, spencerStatement_holds, meshStatement_holds, roundingStatement_holds, cosine_counterexample_of"
      module: "ChowlaOpus.Parts.Partial, Spencer, Mesh, Rounding, MainOf"
      status: "proved"
