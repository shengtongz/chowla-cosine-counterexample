# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A counterexample to Chowla's cosine conjecture"
  description: >-
    For a finite set A of positive integers let f_A(t) = sum over a in A of cos(2 pi a t),
    and call D(A) = -min_t f_A(t) the depth of A. Chowla conjectured in 1965 that there is an absolute constant c > 0 such that every
    nonempty A satisfies min_t f_A(t) < -c sqrt(|A|) (Chowla's cosine problem; Erdős
    Problem #510). This project is a complete Lean 4 / Mathlib formalization of a
    counterexample from the manuscript "A prime-square counterexample to Chowla's cosine
    conjecture": for every eps > 0 there are arbitrarily large finite sets A of positive
    integers with f_A(t) > -eps sqrt(|A|) for every real t. The manuscript, including the
    counterexample and its proof, was produced by the AI model Astra 6.2, prompted by
    Shengtong Zhang. The Lean formalization was then written by Claude Opus 5.5 agents in
    Cursor. Two theorems are compared. The main one, `Erdos510.erdos_510`, is the negation of
    the statement of Erdős Problem #510 in Google DeepMind's formal-conjectures repository,
    copied verbatim from FormalConjectures/ErdosProblems/510.lean at commit 7db2ea3 (where
    it is tagged research open). The second, `cosine_counterexample`, is Theorem 1 of the
    manuscript, which states exactly the result above. The proof
    follows the manuscript. A binary profile given by horizontal slices of an annulus is
    smoothed so that a Fourier multiplier in the logarithm of the radius (computed through
    the Laplace and Mellin transforms of the Bessel function J_0 and Legendre duplication)
    produces a family with nonnegative Fourier transform. Auxiliary circle coordinates make
    the label frequencies primitive integer vectors, a Chinese remainder construction maps
    them to multiplicatively independent integers, and characters modulo a prime square
    with an explicit Gauss-sum identity and equidistributed phases realize the required
    multipliers. Poisson summation over residue classes gives a lower bound for the
    weighted cosine sum, and the weights are rounded to a set using Spencer's discrepancy
    theorem, which is proved here from a partial-colouring lemma, together with a discrete
    de la Vallée-Poussin interpolation bound. The proof uses only the axioms propext,
    Classical.choice and Quot.sound.
  authors:
    - "Shengtong Zhang"
  responsible_maintainers:
    - "Shengtong Zhang"
  license: "Apache-2.0"

